<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>latale · 葉南星称号</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #eef2f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      color: #1e2b3c;
    }

    .card {
      max-width: 1100px;
      width: 100%;
      background: #ffffff;
      border-radius: 36px;
      box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25),
                  0 8px 24px -8px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    /* 个人资料头部 */
    .profile-header {
      background: linear-gradient(145deg, #f9fbfd 0%, #e9eef4 100%);
      padding: 32px 24px 28px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 0, 0, 0.03);
    }

    .avatar-wrapper {
      display: inline-block;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 8px 18px rgba(0, 20, 40, 0.12), 0 2px 6px rgba(0,0,0,0.05);
      padding: 5px;
      margin-bottom: 16px;
      transition: transform 0.25s ease;
    }

    .avatar-wrapper:hover {
      transform: scale(1.02);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .profile-name {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #1e2b3c;
      margin-bottom: 6px;
    }

    .profile-name small {
      font-size: 1rem;
      font-weight: 400;
      color: #4a5f7a;
      letter-spacing: 1px;
      margin-left: 8px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 500;
      color: #2c3e50;
      margin: 24px 32px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 1px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 24px;
      background: #4b7bec;
      border-radius: 4px;
    }

    /* ---------- 5x4 等距网格 ---------- */
    .gif-grid {
      background: #f6f9fe;
      margin: 0 20px 8px;
      padding: 24px 20px;
      border-radius: 32px;
      /* 使用 grid 实现严格的 5 列等距布局 */
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      /* 行间距与列间距完全相等，形成等距 */
      gap: 16px;
      /* 确保所有单元格等宽等高(高度由内容撑开, 但卡片高度基本一致) */
      align-items: stretch;
      justify-content: stretch;
      border: 1px solid #e2eaf6;
      box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.8), 0 4px 12px rgba(0, 20, 40, 0.04);
    }

    /* 每个 GIF 卡片：变成 grid item，自动填满单元格 */
    .gif-card {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 6px 14px rgba(0, 20, 40, 0.08), 0 2px 6px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
      padding: 8px;
      border: 1px solid rgba(200, 215, 235, 0.4);
      /* 保证卡片宽度自适应列宽 */
      width: 100%;
      height: 100%;
      /* 可保持卡片内图片居中 */
      min-width: 0;   /* 防止溢出 */
    }

    .gif-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 24px -8px rgba(40, 80, 140, 0.2), 0 4px 10px rgba(0,0,0,0.05);
      border-color: #b8d1f0;
    }

    /* 保持原始尺寸，但限制最大宽度防止撑破 */
    .gif-card img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
      user-drag: none;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: auto;
      border-radius: 12px;  /* 稍微圆角让图片更柔和 */
    }

    /* 正文卡片 */
    .content-card {
      background: #ffffff;
      margin: 22px 24px 28px;
      padding: 28px 32px;
      border-radius: 28px;
      box-shadow: 0 4px 14px rgba(0, 20, 40, 0.04), 0 1px 4px rgba(0,0,0,0.02);
      border: 1px solid #eef3fc;
      line-height: 1.8;
      color: #2f4056;
      font-size: 1rem;
    }

    .content-card p {
      margin-bottom: 10px;
    }

    .content-card p:last-child {
      margin-bottom: 0;
    }

    /* 页脚 */
    .footer {
      text-align: center;
      padding: 22px 24px 28px;
      background: #f2f6fc;
      border-top: 1px solid #dfe9f2;
      font-size: 0.9rem;
      color: #3a4e66;
      letter-spacing: 0.5px;
    }

    .footer a {
      color: #3b6ea5;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dashed #a0b9d6;
      transition: all 0.2s;
      padding-bottom: 2px;
      margin-left: 8px;
    }

    .footer a:hover {
      color: #1b3b63;
      border-bottom-color: #4b7bec;
    }

    .footer p {
      margin: 6px 0;
    }

    .footer .sep {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: #a0b9d6;
      border-radius: 50%;
      margin: 0 12px;
      vertical-align: middle;
    }

    /* 响应式：中小屏幕改为4列 / 3列，依然等距 */
    @media (max-width: 900px) {
      .gif-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
    }

    @media (max-width: 700px) {
      .gif-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
    }

    @media (max-width: 500px) {
      .gif-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .gif-card {
        border-radius: 16px;
        padding: 6px;
      }
      .gif-card img {
        border-radius: 8px;
      }
    }

    @media (max-width: 640px) {
      body { padding: 12px 8px; }
      .card { border-radius: 28px; }
      .profile-header { padding: 22px 16px 20px; }
      .profile-name { font-size: 1.7rem; }
      .avatar-wrapper { width: 80px; height: 80px; }
      .gif-grid { margin: 0 12px 8px; padding: 18px 14px; gap: 12px; }
      .section-title { margin: 20px 20px 10px; font-size: 1.2rem; }
      .content-card { margin: 16px 16px 22px; padding: 22px 18px; }
    }
  </style>
</head>
